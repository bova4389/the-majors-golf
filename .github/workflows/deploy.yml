name: Deploy to DreamHost

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Build the set of files that should actually be on the public web server.
      # This is an EXCLUDE list, not an allow list, on purpose: if a new site asset
      # is added and nobody updates this file, it still gets deployed. Forgetting to
      # exclude an internal doc is untidy; forgetting to include a stylesheet breaks
      # the live site.
      #
      # rsync (not cp) because the trailing "./" copies dotfiles too, so .htaccess
      # is carried into _deploy along with everything else.
      - name: Stage deployable files
        run: |
          mkdir -p _deploy
          rsync -a \
            --exclude '_deploy' \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.gitignore' \
            --exclude 'CLAUDE.md' \
            --exclude 'data-archive' \
            --exclude 'archive-scripts' \
            --exclude '__pycache__' \
            ./ _deploy/
          echo "Staged for deploy:"
          find _deploy -type f | sort

      - name: Deploy via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 22
          local_path: './_deploy/*'
          remote_path: /home/mattbova/basic-bros-pga-pickems.com/
          sftp_only: true
          delete_remote_files: false

      # Second step is required: the action runs `put -r ./* <remote>`, and sftp's glob
      # does not match leading dots, so ./* silently skips .htaccess. Without this step
      # the no-cache headers (Layer 1 of cache busting) never reach the server.
      - name: Deploy .htaccess
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 22
          local_path: './_deploy/.htaccess'
          remote_path: /home/mattbova/basic-bros-pga-pickems.com/
          sftp_only: true
          delete_remote_files: false
