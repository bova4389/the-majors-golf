name: Deploy to DreamHost

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # TODO: update server-dir to your confirmed DreamHost webroot path
          server-dir: /home/mattbova/basic-bros-pga-pickems.com/
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/CLAUDE.md
